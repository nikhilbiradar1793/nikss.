{% extends "base.html" %}

{% block title %}Add Course | NIKSS Admin{% endblock %}

{% block content %}

<section class="admin-form-head">
    <a class="back" href="{{ url_for('admin_dashboard') }}">
        ← Admin Dashboard
    </a>

    <div class="eyebrow">COURSE STUDIO</div>

    <h1>
        Add <em>New Course</em>
    </h1>
</section>

<section class="form-card wide">

    <form
            method="POST"
            action="{{ url_for('admin_add_course') }}"
            class="form grid-form"
            enctype="multipart/form-data"
    >

        <label>
            Course title
            <input
                    name="title"
                    placeholder="Example: Java Programming"
                    required
            >
        </label>

        <label>
            Price
            <input
                    name="price"
                    type="number"
                    min="0"
                    step="1"
                    value="0"
            >
        </label>

        <label class="span2">
            Description
            <textarea
                    name="description"
                    rows="5"
                    placeholder="Describe what students will learn in this course..."
                    required
            ></textarea>
        </label>

        <label class="span2">
            Course Poster / Image
            <input
                    type="file"
                    name="poster_image"
                    accept=".jpg,.jpeg,.png,.webp"
            >
            <small>
                Upload JPG, JPEG, PNG or WEBP.
                Recommended: a high-quality course poster.
            </small>
        </label>

        <label>
            Level
            <select name="level">
                <option selected>Beginner</option>
                <option>Intermediate</option>
                <option>Advanced</option>
            </select>
        </label>

        <label>
            Duration
            <input
                    name="duration"
                    value="8 Weeks"
                    placeholder="Example: 8 Weeks"
            >
        </label>

        <div class="form-submit span2">
            <button class="btn primary" type="submit">
                Create Course →
            </button>
        </div>

    </form>

</section>

{% endblock %}
